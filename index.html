<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모르가르드 연대기 — 공식 역사서</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Nanum Myeongjo (본문용), Cinzel (영문 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nanum Myeongjo', serif;
      background-color: #0b0c10;
      color: #c5a059;
      overflow-x: hidden;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    /* 고서 양피지 질감 커스텀 배경 */
    .parchment-bg {
      background: radial-gradient(circle, rgba(24, 20, 16, 0.95) 0%, rgba(10, 8, 6, 0.98) 100%),
                  radial-gradient(ellipse at center, rgba(197, 160, 89, 0.05) 0%, rgba(0,0,0,0.8) 100%);
    }
    .parchment-card {
      background-color: #16120e;
      background-image: radial-gradient(#261d15 1px, transparent 0);
      background-size: 24px 24px;
      border: 1px solid #4a3b2c;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.8);
    }
    /* 모서리 장식 스타일 */
    .corner-ornament {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #c5a059;
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

    /* 페이드 전환 효과 */
    .fade-in {
      animation: fadeIn 0.4s ease-in-out forwards;
    }
    .fade-out {
      animation: fadeOut 0.3s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-6px); }
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0c10;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a2e22;
      border-radius: 4px;
      border: 1px solid #c5a059;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5a4734;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none parchment-bg text-amber-100">

  <!-- 헤더 (네비게이션) -->
  <header class="w-full py-4 px-6 border-b border-amber-900/40 bg-black/60 backdrop-blur-md sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="scrollToTop()">
      <div class="w-7 h-7 rounded-full border border-amber-500/60 flex items-center justify-center text-amber-400 font-bold text-xs bg-amber-950/40">
        ⚔️
      </div>
      <span class="font-bold text-lg text-amber-200 tracking-wider">모르가르드 연대기</span>
    </div>
    <button onclick="toggleTocModal()" class="px-4 py-1.5 border border-amber-700/60 rounded bg-amber-950/30 text-amber-300 hover:bg-amber-900/50 hover:border-amber-500 transition-all text-sm font-semibold flex items-center space-x-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
      </svg>
      <span>목차</span>
    </button>
  </header>

  <!-- 1. 첫 화면 (메인 랜딩 HERO 영역) -->
  <section id="hero-section" class="min-h-[85vh] flex flex-col items-center justify-center text-center px-4 relative py-12">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/40 to-black/90 pointer-events-none"></div>

    <div class="relative z-10 max-w-3xl space-y-6">
      <div class="inline-block px-3 py-1 border border-amber-600/40 rounded-full bg-amber-950/40 text-amber-400 text-xs tracking-widest font-cinzel mb-2">
        OFFICIAL CHRONICLES
      </div>
      <h1 class="text-4xl md:text-6xl font-extrabold text-amber-200 tracking-wider leading-tight drop-shadow-md">
        모르가르드 연대기
      </h1>
      <p class="text-xl md:text-2xl text-amber-400/90 font-medium tracking-wide">
        하나의 왕관 아래, 세 개의 운명
      </p>

      <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-amber-600 to-transparent mx-auto my-6"></div>

      <p class="text-amber-300/70 text-sm md:text-base max-w-xl mx-auto leading-relaxed">
        무너진 왕국과 세 갈래로 갈라진 맹세의 기록.<br>
        판타지 대륙 모르가르드의 고대 역사서를 지금 펼쳐보세요.
      </p>

      <div class="pt-6">
        <button onclick="openChronicle()" class="px-8 py-3.5 bg-gradient-to-r from-amber-900/80 via-amber-800/90 to-amber-900/80 border border-amber-500 text-amber-100 font-bold rounded shadow-lg hover:shadow-amber-900/50 hover:brightness-110 transition-all transform hover:-translate-y-0.5">
          연대기 펼치기 📜
        </button>
      </div>
    </div>
  </section>

  <!-- 2. 연대기 본문 섹션 -->
  <main id="chronicle-section" class="max-w-4xl w-full mx-auto px-4 py-8 relative z-10">

    <!-- 본문 제어 컨트롤러 (목차 이동 & 글자 크기 조절) -->
    <div class="parchment-card p-4 rounded-lg mb-6 flex flex-wrap justify-between items-center gap-4">
      <button onclick="toggleTocModal()" class="px-3.5 py-1.5 border border-amber-700/60 rounded bg-black/40 text-amber-300 hover:border-amber-500 text-xs md:text-sm flex items-center space-x-1.5">
        <span>≡ 목차 보기</span>
      </button>

      <!-- 글자 크기 조절기 -->
      <div class="flex items-center space-x-2 text-xs md:text-sm text-amber-300">
        <span>글자 크기:</span>
        <button onclick="changeFontSize(-1)" class="w-7 h-7 border border-amber-700/70 rounded bg-black/40 hover:bg-amber-900/40 text-amber-200 font-bold flex items-center justify-center shadow-inner">-</button>
        <span id="font-size-display" class="w-10 text-center font-bold text-amber-400">18px</span>
        <button onclick="changeFontSize(1)" class="w-7 h-7 border border-amber-700/70 rounded bg-black/40 hover:bg-amber-900/40 text-amber-200 font-bold flex items-center justify-center shadow-inner">+</button>
        <button onclick="resetFontSize()" class="px-2.5 py-1 border border-amber-700/70 rounded bg-black/40 hover:bg-amber-900/40 text-amber-200 text-xs ml-1">기본</button>
      </div>
    </div>

    <!-- 양피지 책 페이지 카드 -->
    <div class="parchment-card rounded-lg p-6 md:p-12 relative min-h-[500px] flex flex-col justify-between">
      <div class="corner-ornament corner-tl"></div>
      <div class="corner-ornament corner-tr"></div>
      <div class="corner-ornament corner-bl"></div>
      <div class="corner-ornament corner-br"></div>

      <!-- 페이지 본문 내용 영역 -->
      <div id="page-content" class="fade-in">
        <!-- 장 번호 뱃지 및 제목 -->
        <div class="text-center mb-8 border-b border-amber-900/50 pb-6">
          <span id="chapter-number-badge" class="font-cinzel text-xs text-amber-500 tracking-widest uppercase block mb-1">CHAPTER 1</span>
          <h2 id="chapter-title" class="text-2xl md:text-4xl font-extrabold text-amber-200 tracking-wide">
            프롤로그 — 태초의 땅
          </h2>
        </div>

        <!-- 본문 문단들 (JavaScript에서 주입) -->
        <div id="chapter-body" class="space-y-6 text-amber-100/95 leading-relaxed font-semibold">
          <!-- 텍스트 내용 -->
        </div>
      </div>

      <!-- 하단 페이지 넘김 네비게이션 -->
      <div class="mt-12 pt-6 border-t border-amber-900/40 flex justify-between items-center text-sm">
        <button id="prev-btn" onclick="prevPage()" class="px-4 py-2 border border-amber-800 rounded bg-black/40 text-amber-300 hover:bg-amber-900/40 disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center space-x-1">
          <span>← 이전 페이지</span>
        </button>

        <span id="page-indicator" class="text-amber-500 text-xs md:text-sm font-semibold">
          1 / 10
        </span>

        <button id="next-btn" onclick="nextPage()" class="px-4 py-2 border border-amber-800 rounded bg-black/40 text-amber-300 hover:bg-amber-900/40 disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center space-x-1">
          <span>다음 페이지 →</span>
        </button>
      </div>
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="py-6 border-t border-amber-900/40 text-center text-xs text-amber-600/80 mt-12">
    <p>© MORGARD CHRONICLES. All rights reserved.</p>
    <p class="mt-1 text-amber-700/60">마인크래프트 RPG 세계관 모르가르드 공식 역사서</p>
  </footer>

  <!-- 3. 목차 모달 팝업 -->
  <div id="toc-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="parchment-card max-w-lg w-full rounded-lg p-6 relative max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-amber-900/60 pb-3 mb-4">
        <h3 class="text-xl font-bold text-amber-200">연대기 목차</h3>
        <button onclick="toggleTocModal()" class="text-amber-400 hover:text-amber-100 text-xl font-bold px-2">✕</button>
      </div>

      <!-- 목차 리스트 -->
      <div id="toc-list" class="overflow-y-auto space-y-2 pr-1">
        <!-- JS로 동적 생성 -->
      </div>

      <div class="mt-4 pt-3 border-t border-amber-900/60 text-right">
        <button onclick="toggleTocModal()" class="px-4 py-1.5 border border-amber-700/60 rounded text-amber-300 text-sm hover:bg-amber-900/40">
          닫기
        </button>
      </div>
    </div>
  </div>

    // 상태 변수
    let currentPageIndex = 0;
    let currentFontSize = 18;

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentPage();
      buildTocModal();

      // 키보드 방향키 페이지 넘김 지원
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevPage();
        if (e.key === 'ArrowRight') nextPage();
      });
    });

    // 2. 메인에서 연대기로 이동
    function openChronicle() {
      const chronicleEl = document.getElementById('chronicle-section');
      chronicleEl.scrollIntoView({ behavior: 'smooth' });
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 3. 페이지 렌더링 함수
    function renderCurrentPage() {
      const data = chronicleData[currentPageIndex];
      const pageContentEl = document.getElementById('page-content');

      // Fade Out 효과
      pageContentEl.classList.remove('fade-in');
      pageContentEl.classList.add('fade-out');

      setTimeout(() => {
        // 헤더 뱃지 및 제목 설정
        document.getElementById('chapter-number-badge').textContent = data.badge;
        document.getElementById('chapter-title').textContent = `${data.chapter} — ${data.subtitle}`;

        // 본문 문단 작성
        const bodyContainer = document.getElementById('chapter-body');
        bodyContainer.innerHTML = '';
        
        data.paragraphs.forEach(para => {
          const p = document.createElement('p');
          p.textContent = para;
          p.style.fontSize = `${currentFontSize}px`;
          bodyContainer.appendChild(p);
        });

        // 페이지 인디케이터 업데이트
        document.getElementById('page-indicator').textContent = `${currentPageIndex + 1} / ${chronicleData.length}`;

        // 버튼 활성화/비활성화
        document.getElementById('prev-btn').disabled = currentPageIndex === 0;
        document.getElementById('next-btn').disabled = currentPageIndex === chronicleData.length - 1;

        // Fade In 효과
        pageContentEl.classList.remove('fade-out');
        pageContentEl.classList.add('fade-in');
      }, 150);
    }

    // 4. 페이지 이동 제어
    function prevPage() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        renderCurrentPage();
      }
    }

    function nextPage() {
      if (currentPageIndex < chronicleData.length - 1) {
        currentPageIndex++;
        renderCurrentPage();
      }
    }

    function goToChapter(index) {
      currentPageIndex = index;
      renderCurrentPage();
      toggleTocModal();
      openChronicle();
    }

    // 5. 글자 크기 조절 기능
    function changeFontSize(delta) {
      const newSize = currentFontSize + delta;
      if (newSize >= 14 && newSize <= 26) {
        currentFontSize = newSize;
        document.getElementById('font-size-display').textContent = `${currentFontSize}px`;
        
        // 현재 본문 폰트 크기 동적 업데이트
        const paragraphs = document.querySelectorAll('#chapter-body p');
        paragraphs.forEach(p => p.style.fontSize = `${currentFontSize}px`);
      }
    }

    function resetFontSize() {
      currentFontSize = 18;
      document.getElementById('font-size-display').textContent = '18px';
      const paragraphs = document.querySelectorAll('#chapter-body p');
      paragraphs.forEach(p => p.style.fontSize = '18px');
    }

    // 6. 목차 생성 및 모달 제어
    function buildTocModal() {
      const tocContainer = document.getElementById('toc-list');
      tocContainer.innerHTML = '';

      chronicleData.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded border border-amber-900/40 bg-black/40 hover:bg-amber-900/40 hover:border-amber-600 transition-all flex justify-between items-center group";
        btn.onclick = () => goToChapter(index);

        btn.innerHTML = `
          <div>
            <span class="text-xs text-amber-500 font-cinzel block">${item.badge}</span>
            <span class="font-bold text-amber-200 group-hover:text-amber-100">${item.chapter} — ${item.subtitle}</span>
          </div>
          <span class="text-amber-600 group-hover:text-amber-400 text-sm">이동 →</span>
        `;
        tocContainer.appendChild(btn);
      });
    }

    function toggleTocModal() {
      const modal = document.getElementById('toc-modal');
      modal.classList.toggle('hidden');
    }
  </script>
